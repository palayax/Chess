# Pins for the two model files the app downloads once on first run (docs/MODEL_DOWNLOAD_DESIGN.md, D2a; voice as .tar.gz since D2f).
# Java-properties format: read by scripts/fetch_models.sh, scripts/publish_models.sh,
# scripts/model_test_server.py and the Gradle generateModelPins task in :engine (net) and :app (voice, tag).
# The build does NOT need the model files themselves: it compiles these pins into the app
# (GeneratedNetPins / GeneratedModelPins); a fresh install downloads the files and checks them against
# the pins. If the files are present under vendor/models/ the build also verifies them (developer safety).
#
# The NNUE net NAME is deliberately not here: its single source of truth is
# vendor/Stockfish/src/evaluate.h EvalFileDefaultName (CLAUDE.md engine gotcha 5). Its first 12 hex
# digits must be a prefix of net.sha256 (generateModelPins checks it).
net.size=98511183
net.url.base=https://tests.stockfishchess.org/api/nn/
# Pinned by fetch_models.sh on its first successful run (full SHA-256 of the file, and the NNUE header:
# bytes 0..3 = file version, bytes 4..7 = Stockfish's architecture hash, both little-endian uint32).
# net.version must equal Version in vendor/Stockfish/src/nnue/nnue_common.h (generateModelPins checks it).
net.sha256=1a298aa575a085434d29027978dc36867fe9c5bcea9376654b7a8eba1e52dfc2
net.arch_hash=a85b2205
net.version=0x6a448afa

kokoro.archive.url=https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-int8-en-v0_19.tar.bz2
kokoro.archive.sha256=c9f0dd393615805b0bab050c340834d5e684e732aec91c0e860cd30e982c08bd
kokoro.archive.size=103248205
# The plain .tar inside the upstream archive. Pinned by fetch_models.sh on its first successful run (it
# hashes the bunzip2 output and writes it here). The app checks the unpacked voice stream against these and
# the installed voice's marker holds kokoro.tar.sha256 (so the voice a bundled build left on a phone is kept).
kokoro.tar.sha256=7190c4801645bf31d10996477a04082019d9cf492ad3d5aeef7b1f7cf10a5dea
kokoro.tar.size=158269440
# What the app downloads and publish_models.sh uploads (D2f): that tar compressed with GNU `gzip -9 -n`
# (no name, no time stamp, so the bytes are reproducible), kokoro-int8-en-v0_19.tar.gz. 102.5 MB instead
# of 158.3 MB; java.util.zip inflates it while unpacking in about 1 s on the emulator. Pinned by
# fetch_models.sh on its first run after the tar is verified, then checked.
kokoro.targz.sha256=936044f1f7e3e9822e35ac3212ed555a958983b4c255b9aac7c3b9c9069619c6
kokoro.targz.size=102543452

# The GitHub release (immutable tag) that holds both files. First-run URL =
# BuildConfig.MODEL_BASE_URL + release.tag + "/" + file name. Must match models-YYYY.MM[.n].
release.tag=models-2026.10

# C2 (docs/LLM_REPHRASE_DESIGN.md): the optional wording model. The prompt version moves every rephrase cache
# key when it changes; it must equal RephrasePrompt.VERSION in :core (RephrasePromptTest).
rephrase.prompt.version=1
# The wording model the app offers (optional, owner decision 2026-10-09: Qwen2.5-1.5B-Instruct Q4_K_M, Apache-2.0),
# from Qwen's official GGUF repository at a fixed commit, re-hosted unmodified on the release tag below. Size and
# SHA-256 were measured on the fetched file (they equal the Hub's LFS pins); arch is the GGUF's general.architecture.
rephrase.model.id=qwen2.5-1.5b-instruct-q4_k_m
rephrase.model.file=qwen2.5-1.5b-instruct-q4_k_m.gguf
rephrase.model.url=https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/91cad51170dc346986eccefdc2dd33a9da36ead9/qwen2.5-1.5b-instruct-q4_k_m.gguf
rephrase.model.size=1117320736
rephrase.model.sha256=6a1a2eb6d15622bf3c96857206351ba97e1af16c30d7a74ee38970e434e9407e
rephrase.model.arch=qwen2
rephrase.model.license=Apache-2.0
# Its own immutable release tag (C2): the net and the voice stay on release.tag, untouched, so publishing the wording
# model is one new release holding one file (and its LICENSE); first-run URL = MODEL_BASE_URL + this tag + "/" + file.
rephrase.release.tag=models-2026.11
# The llama.cpp tag compiled into librephrase.so (vendor/LLAMA_CPP_VERSION.txt; :rephrase's build checks they agree)
# and the tag the P2a host measurement ran on.
rephrase.runtime.tag=b11190
