# Runs the instrumented suites (:engine, then :app) on an API 34 google_apis x86_64 emulator, like the local chess34 AVD.
# Started by hand (Actions tab > Emulator tests > Run workflow). The models reach the tests only as seed assets of the
# test APKs (CLAUDE.md, D2d), so scripts/fetch_models.sh runs first (about 200 MB from this repo's models release).
name: Emulator tests

on:
  # A push runs it only when the commit message contains "[emulator]" (a workflow_dispatch needs the file on the
  # default branch first).
  push:
    branches: ["claude/**"]
  workflow_dispatch:
    inputs:
      suites:
        description: "Gradle tasks to run"
        default: ":engine:connectedDebugAndroidTest :app:connectedDebugAndroidTest"

jobs:
  emulator:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[emulator]')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "ndk;28.2.13676358" "cmake;3.22.1" "emulator" "platform-tools" \
            "system-images;android-34;google_apis;x86_64"

      - name: Fetch native sources and the models (test seed assets)
        run: |
          bash scripts/fetch_stockfish.sh
          bash scripts/fetch_llama_cpp.sh
          bash scripts/fetch_models.sh

      - name: Build the app and test APKs
        run: bash ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :engine:assembleDebugAndroidTest

      - name: Start the emulator (chess34 equivalent, 4 GB RAM)
        run: |
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n ci34 \
            -k "system-images;android-34;google_apis;x86_64" -d pixel_6 --force
          printf 'hw.ramSize=4096\ndisk.dataPartition.size=8G\nhw.cpu.ncore=4\n' >> ~/.android/avd/ci34.avd/config.ini
          nohup "$ANDROID_HOME/emulator/emulator" -avd ci34 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect \
            -no-snapshot -camera-back none > emulator.log 2>&1 &
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$ADB" wait-for-device
          for i in $(seq 1 120); do
            [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            sleep 5
          done
          "$ADB" shell settings put global window_animation_scale 0
          "$ADB" shell settings put global transition_animation_scale 0
          "$ADB" shell settings put global animator_duration_scale 0
          # CLAUDE.md: a fresh emulator can fail a whole run with "Process crashed" until it has settled.
          for i in $(seq 1 60); do
            L=$("$ADB" shell cat /proc/loadavg | cut -d' ' -f1); echo "load $L"
            awk "BEGIN{exit !($L < 4)}" && break
            sleep 10
          done

      - name: Instrumented tests
        run: bash ./gradlew --no-daemon --continue ${{ inputs.suites || ':engine:connectedDebugAndroidTest :app:connectedDebugAndroidTest' }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: |
            **/build/outputs/androidTest-results/**
            **/build/reports/androidTests/**
            emulator.log
          if-no-files-found: ignore
